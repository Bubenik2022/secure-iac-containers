services:
  sandbox:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    tmpfs:
      - /tmp
    networks: [isolated]

networks:
  isolated:
    internal: true
